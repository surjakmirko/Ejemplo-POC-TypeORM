<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRUD Productos</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f2f5;
      color: #333;
      padding: 2rem;
    }

    h1 { text-align: center; margin-bottom: 1.5rem; }

    .container {
      max-width: 700px;
      margin: 0 auto;
    }

    .card {
      background: #fff;
      border-radius: 8px;
      padding: 1.5rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-bottom: 1.5rem;
    }

    .card h2 {
      margin-bottom: 1rem;
      font-size: 1.1rem;
    }

    .form-row {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
    }

    input {
      flex: 1;
      padding: 0.6rem 0.8rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.95rem;
    }

    select {
      flex: 1;
      padding: 0.6rem 0.8rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.95rem;
      background: #fff;
    }

    input:focus, select:focus { outline: none; border-color: #4a90d9; }

    .hint { font-size: 0.85rem; color: #888; margin-top: 0.5rem; }
    .tags { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.75rem; }
    .tag { background: #e8f0fb; color: #357abd; border-radius: 999px; padding: 0.15rem 0.7rem; font-size: 0.85rem; }

    button {
      padding: 0.6rem 1.2rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .btn-primary { background: #4a90d9; color: #fff; }
    .btn-primary:hover { background: #357abd; }
    .btn-success { background: #27ae60; color: #fff; }
    .btn-success:hover { background: #219150; }
    .btn-danger { background: #e74c3c; color: #fff; }
    .btn-danger:hover { background: #c0392b; }
    .btn-secondary { background: #95a5a6; color: #fff; }
    .btn-secondary:hover { background: #7f8c8d; }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 0.75rem;
      text-align: left;
      border-bottom: 1px solid #eee;
    }

    th { font-weight: 600; color: #555; }

    .actions { display: flex; gap: 0.4rem; }

    .msg {
      padding: 0.6rem;
      border-radius: 6px;
      margin-bottom: 1rem;
      font-size: 0.9rem;
      display: none;
    }

    .msg-ok { background: #d4edda; color: #155724; }
    .msg-err { background: #f8d7da; color: #721c24; }

    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Gestion de Productos</h1>

    <div id="msg" class="msg"></div>

    <div class="card">
      <h2>Crear Tipo de Producto</h2>
      <form id="tipo-form">
        <div class="form-row">
          <input type="text" id="tipo-nombre" placeholder="Nombre del tipo (ej: Bebidas)" required />
          <button type="submit" class="btn-primary" style="flex:none">Crear tipo</button>
        </div>
      </form>
      <div id="tipo-tags" class="tags"></div>
    </div>

    <div class="card">
      <h2 id="form-title">Crear Producto</h2>
      <form id="product-form">
        <input type="hidden" id="edit-id" />
        <div class="form-row">
          <input type="text" id="name" placeholder="Nombre" required />
        </div>
        <div class="form-row">
          <input type="number" id="price" placeholder="Precio" step="0.01" min="0" required />
          <input type="number" id="stock" placeholder="Stock" min="0" value="0" />
        </div>
        <div class="form-row">
          <select id="tipo" required>
            <option value="">Elegir tipo...</option>
          </select>
        </div>
        <p id="tipo-hint" class="hint hidden">Primero creá un tipo de producto para poder cargar productos.</p>
        <div class="form-row">
          <button type="submit" class="btn-primary" id="btn-submit">Crear</button>
          <button type="button" class="btn-secondary hidden" id="btn-cancel" onclick="resetForm()">Cancelar</button>
        </div>
      </form>
    </div>

    <div class="card">
      <h2>Lista de Productos</h2>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Tipo</th>
            <th>Precio</th>
            <th>Stock</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="product-list"></tbody>
      </table>
      <p id="empty-msg" class="hidden" style="text-align:center;padding:1rem;color:#999;">No hay productos</p>
    </div>
  </div>

  <script>
    const API = "/products";
    const API_TIPOS = "/tipos";
    const form = document.getElementById("product-form");
    const msgEl = document.getElementById("msg");
    const tipoForm = document.getElementById("tipo-form");
    const tipoSelect = document.getElementById("tipo");

    function esc(t) {
      return String(t).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    async function errorMsg(res, porDefecto) {
      try {
        const d = await res.json();
        return d.error ? `${porDefecto}: ${d.error}` : (d.message || porDefecto);
      } catch {
        return porDefecto;
      }
    }

    function showMsg(text, ok = true) {
      msgEl.textContent = text;
      msgEl.className = "msg " + (ok ? "msg-ok" : "msg-err");
      msgEl.style.display = "block";
      setTimeout(() => msgEl.style.display = "none", 3000);
    }

    function resetForm() {
      form.reset();
      document.getElementById("edit-id").value = "";
      document.getElementById("form-title").textContent = "Crear Producto";
      document.getElementById("btn-submit").textContent = "Crear";
      document.getElementById("btn-cancel").classList.add("hidden");
    }

    async function loadProducts() {
      try {
        const res = await fetch(API);
        const data = await res.json();
        const tbody = document.getElementById("product-list");
        const emptyMsg = document.getElementById("empty-msg");

        if (data.length === 0) {
          tbody.innerHTML = "";
          emptyMsg.classList.remove("hidden");
          return;
        }

        emptyMsg.classList.add("hidden");
        tbody.innerHTML = data.map(p => `
          <tr>
            <td>${p.id}</td>
            <td>${esc(p.nombre)}</td>
            <td>${p.tipo ? esc(p.tipo.nombre) : "-"}</td>
            <td>$${parseFloat(p.precio).toFixed(2)}</td>
            <td>${p.stock}</td>
            <td class="actions">
              <button class="btn-success" onclick="editProduct(${p.id})">Editar</button>
              <button class="btn-danger" onclick="deleteProduct(${p.id})">Eliminar</button>
            </td>
          </tr>
        `).join("");
      } catch {
        showMsg("Error al cargar productos", false);
      }
    }

    async function loadTipos(seleccionado) {
      try {
        const res = await fetch(API_TIPOS);
        const tipos = await res.json();
        const actual = seleccionado !== undefined ? String(seleccionado) : tipoSelect.value;

        tipoSelect.innerHTML = '<option value="">Elegir tipo...</option>' +
          tipos.map(t => `<option value="${t.id}">${esc(t.nombre)}</option>`).join("");
        tipoSelect.value = actual;

        document.getElementById("tipo-tags").innerHTML =
          tipos.map(t => `<span class="tag">${esc(t.nombre)}</span>`).join("");
        document.getElementById("tipo-hint").classList.toggle("hidden", tipos.length > 0);
        document.getElementById("btn-submit").disabled = tipos.length === 0;
      } catch {
        showMsg("Error al cargar tipos", false);
      }
    }

    tipoForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const nombre = document.getElementById("tipo-nombre").value.trim();
      try {
        const res = await fetch(API_TIPOS, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ nombre }),
        });
        if (!res.ok) throw new Error(await errorMsg(res, "Error al crear tipo"));
        const creado = await res.json();
        showMsg("Tipo creado");
        tipoForm.reset();
        loadTipos(creado.id);
      } catch (err) {
        showMsg(err.message || "Error al crear tipo", false);
      }
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const id = document.getElementById("edit-id").value;
      const body = {
        nombre: document.getElementById("name").value,
        precio: parseFloat(document.getElementById("price").value),
        stock: parseInt(document.getElementById("stock").value) || 0,
        tipoId: parseInt(tipoSelect.value),
      };

      try {
        const url = id ? `${API}/${id}` : API;
        const method = id ? "PUT" : "POST";
        const res = await fetch(url, {
          method,
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });

        if (!res.ok) throw new Error(await errorMsg(res, "Error al guardar producto"));
        showMsg(id ? "Producto actualizado" : "Producto creado");
        resetForm();
        loadProducts();
      } catch (err) {
        showMsg(err.message || "Error al guardar producto", false);
      }
    });

    async function editProduct(id) {
      try {
        const res = await fetch(`${API}/${id}`);
        const p = await res.json();
        document.getElementById("edit-id").value = p.id;
        document.getElementById("name").value = p.nombre;
        document.getElementById("price").value = p.precio;
        document.getElementById("stock").value = p.stock;
        tipoSelect.value = p.tipo ? p.tipo.id : "";
        document.getElementById("form-title").textContent = "Editar Producto";
        document.getElementById("btn-submit").textContent = "Actualizar";
        document.getElementById("btn-cancel").classList.remove("hidden");
      } catch {
        showMsg("Error al cargar producto", false);
      }
    }

    async function deleteProduct(id) {
      if (!confirm("Eliminar producto?")) return;
      try {
        const res = await fetch(`${API}/${id}`, { method: "DELETE" });
        if (!res.ok) throw new Error();
        showMsg("Producto eliminado");
        loadProducts();
      } catch {
        showMsg("Error al eliminar producto", false);
      }
    }

    loadTipos();
    loadProducts();
  </script>
</body>
</html>
